<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <script src="main.js" defer></script>
    </head>

    <body>
        <div class="container"> 
            <svg viewBox="-60 -60 120 120" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <g>
                    <line id="x-axis" x1="-60" x2="60" y1="0" y2="0" style="stroke:rgb(30, 144, 255);stroke-width:1"/>
                    <line id="y-axis" x1="0" y1="-60" x2="0" y2="60" style="stroke:rgb(30, 144, 255);stroke-width:1" />
                </g>
            </svg>
        </div>
        <div>
            <form class="form-popup" id="myForm">
                <input type="number" placeholder="Hole #" name="holeNum" required>
            </form>
        </div>
        <div>
            <p id="coords"></p>
            <p id="coords-list"></p>
        </div>
    </body>
</html>
